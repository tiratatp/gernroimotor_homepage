# ============================================================
# GitHub Actions workflow: build -> validate -> deploy to Pages
# ห้ามแตะไฟล์นี้ / DO NOT EDIT this file
# ------------------------------------------------------------
# What it does (สิ่งที่ไฟล์นี้ทำ):
#   1. Builds index.html from template.html + variables.txt
#      (สร้าง index.html จาก template.html + variables.txt)
#   2. Validates the HTML so a bad edit cannot reach the live site
#      (ตรวจสอบ HTML เพื่อไม่ให้การแก้ไขที่ผิดพลาดไปถึงเว็บจริง)
#   3. Deploys to GitHub Pages only when validation passes
#      (อัปเดตเว็บจริงเฉพาะเมื่อตรวจสอบผ่านเท่านั้น)
# If this workflow fails (red X), the live site is NOT broken —
# it simply keeps the previous version.
# (ถ้าเห็นกากบาทแดง เว็บเดิมยังทำงานปกติ แค่ไม่อัปเดตเวอร์ชันใหม่)
# ============================================================

name: Build, validate, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- Job 1: build + validate (runs on every push and every PR) ----
  validate:
    name: Validate website (ตรวจสอบเว็บไซต์)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build index.html from the template. If variables.txt has a
      # mistake, build.py prints a Thai error message here and stops.
      - name: Build website from template (สร้างเว็บไซต์จาก template)
        run: python3 build.py

      # Structural HTML validation (catches unclosed/misplaced tags).
      # Rules are configured in .htmlvalidate.json
      - name: Validate HTML structure (ตรวจสอบโครงสร้าง HTML)
        run: npx --yes html-validate@11 index.html

      # Sentinel checks: make sure critical pieces still exist.
      - name: Check closing html tag (ตรวจสอบแท็กปิด html)
        run: grep -q "</html>" index.html

      - name: Check JSON-LD block (ตรวจสอบข้อมูล JSON-LD สำหรับ Google)
        run: grep -q 'application/ld+json' index.html

      - name: Check EDIT ME markers (ตรวจสอบเครื่องหมาย EDIT ME)
        run: grep -q "EDIT ME" template.html

      - name: Check copy-paste fences (ตรวจสอบเครื่องหมายคัดลอก)
        run: grep -q "คัดลอกตั้งแต่ตรงนี้" template.html

      - name: Check embedded CSS (ตรวจสอบ CSS ในไฟล์)
        run: |
          grep -q "<style>" template.html
          grep -q "</style>" template.html

      # Image guardrails / กฎสำหรับรูปภาพ: only JPG or PNG, each <= 5 MB.
      # The deploy job shrinks images automatically, so phone photos are
      # fine — but a wrong format (e.g. HEIC) or a huge file fails HERE
      # with a red X; the live site keeps the previous version.
      # อัปโหลดได้เฉพาะ JPG/PNG ไม่เกิน 5 MB ต่อรูป — ระบบจะย่อรูปให้เอง
      # ตอนเผยแพร่ ถ้าไฟล์ผิดประเภทหรือใหญ่เกินจะขึ้นกากบาทแดงตรงนี้
      # (เว็บเดิมยังทำงานปกติ)
      - name: Check image files (ตรวจสอบไฟล์รูปภาพ)
        run: |
          shopt -s nullglob
          for f in images/*; do
            case "$f" in
              *.jpg|*.jpeg|*.png|*.JPG|*.JPEG|*.PNG) ;;
              *) echo "ERROR / ข้อผิดพลาด: $f ไม่ใช่ไฟล์ JPG หรือ PNG (only JPG or PNG allowed in images/)"; exit 1;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "ERROR / ข้อผิดพลาด: $f ใหญ่เกิน 5 MB (larger than 5 MB) — กรุณาย่อรูปให้เล็กลงก่อนอัปโหลด"
              exit 1
            fi
          done

  # ---- Job 2: deploy (only on main, only if validate passed) ----
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build website from template (สร้างเว็บไซต์จาก template)
        run: python3 build.py

      # Optimize images + minify index.html (ย่อรูปภาพและไฟล์ HTML อัตโนมัติ)
      # Runs AFTER build.py and only in this deploy job — template.html keeps
      # its readable comments; only the deployed copy is minified.
      # ทำเฉพาะตอนเผยแพร่เท่านั้น — template.html ยังอ่าน/แก้ได้เหมือนเดิม
      # Tools install OUTSIDE the repo so node_modules never lands in the
      # Pages artifact. / ติดตั้งเครื่องมือไว้นอก repo กัน node_modules หลุดขึ้นเว็บ
      - name: Install optimizer tools (ติดตั้งเครื่องมือย่อไฟล์)
        run: npm install --prefix "$RUNNER_TEMP/optimizer" --no-save --no-package-lock sharp html-minifier-terser

      - name: Optimize images and minify HTML (ย่อรูปภาพและย่อไฟล์ HTML)
        run: node .github/optimize.mjs
        env:
          OPTIMIZER_MODULES: ${{ runner.temp }}/optimizer

      # The minified output must still pass the sentinel checks.
      # ตรวจซ้ำหลังย่อไฟล์ว่าส่วนสำคัญยังอยู่ครบ
      - name: Re-check sentinels after minify (ตรวจสอบซ้ำหลังย่อไฟล์)
        run: |
          grep -q "</html>" index.html
          grep -q 'application/ld+json' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
