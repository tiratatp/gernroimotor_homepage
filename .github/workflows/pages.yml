# ============================================================
# GitHub Actions workflow: test -> build -> optimize -> deploy to Pages
# DO NOT EDIT this file unless you understand the deployment pipeline.
# ------------------------------------------------------------
# What it does:
#   1. Tests and builds index.html from template.html + variables.txt
#   2. Validates HTML and images, then optimizes the exact deploy copy
#   3. Uploads only the minimal validated site and deploys it on main
# If this workflow fails (red X), the live site is NOT broken —
# it simply keeps the previous version.
# ============================================================

name: Build, validate, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each ref has its own queue, so a PR cannot block or cancel a main deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Job 1: test + build + optimize + validate (every push and PR) ----
  build:
    name: Build and validate website (สร้างและตรวจสอบเว็บไซต์)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Tests protect admin input formats and synchronized page structure.
      - name: Run safety tests (รันทดสอบความปลอดภัยของข้อมูล)
        run: python3 -m unittest discover -s tests -v

      # Build index.html from the template. If variables.txt has a
      # mistake, build.py prints a Thai error message here and stops.
      - name: Build website from template (สร้างเว็บไซต์จาก template)
        run: python3 build.py

      # Structural HTML validation (catches unclosed/misplaced tags).
      # Rules are configured in .htmlvalidate.json
      - name: Validate HTML structure (ตรวจสอบโครงสร้าง HTML)
        run: npx --yes html-validate@11.9.0 index.html

      # Sentinel checks: make sure critical pieces still exist.
      - name: Check closing html tag (ตรวจสอบแท็กปิด html)
        run: grep -q "</html>" index.html

      - name: Check JSON-LD block (ตรวจสอบข้อมูล JSON-LD สำหรับ Google)
        run: grep -q 'application/ld+json' index.html

      - name: Check EDIT ME markers (ตรวจสอบเครื่องหมาย EDIT ME)
        run: grep -q "EDIT ME" template.html

      - name: Check copy-paste fences (ตรวจสอบเครื่องหมายคัดลอก)
        run: grep -q "คัดลอกตั้งแต่ตรงนี้" template.html

      - name: Check embedded CSS (ตรวจสอบ CSS ในไฟล์)
        run: |
          grep -q "<style>" template.html
          grep -q "</style>" template.html

      # Image guardrails: only JPG or PNG, each <= 5 MB.
      # This job shrinks images automatically, so phone photos are fine —
      # but a wrong format (e.g. HEIC) or a huge file fails HERE with a red X;
      # the live site keeps the previous version.
      - name: Check image files (ตรวจสอบไฟล์รูปภาพ)
        run: |
          shopt -s nullglob
          for f in images/*; do
            case "$f" in
              *.jpg|*.jpeg|*.png|*.JPG|*.JPEG|*.PNG) ;;
              *) echo "ERROR / ข้อผิดพลาด: $f ไม่ใช่ไฟล์ JPG หรือ PNG (only JPG or PNG allowed in images/)"; exit 1;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "ERROR / ข้อผิดพลาด: $f ใหญ่เกิน 5 MB (larger than 5 MB) — กรุณาย่อรูปให้เล็กลงก่อนอัปโหลด"
              exit 1
            fi
          done

      # Optimize images + minify the built index.html in this same job.
      # template.html stays readable; only the staged deploy copy is minified.
      # Tools install OUTSIDE the repo so node_modules cannot enter the artifact.
      - name: Install optimizer tools (ติดตั้งเครื่องมือย่อไฟล์)
        run: npm install --prefix "$RUNNER_TEMP/optimizer" --no-save --no-package-lock sharp@0.35.3 html-minifier-terser@7.2.0

      - name: Optimize images and minify HTML (ย่อรูปภาพและย่อไฟล์ HTML)
        run: node .github/optimize.mjs
        env:
          OPTIMIZER_MODULES: ${{ runner.temp }}/optimizer

      # Validate the exact optimized output that will be uploaded.
      - name: Validate optimized website (ตรวจสอบเว็บไซต์หลังย่อไฟล์)
        run: |
          npx --yes html-validate@11.9.0 index.html
          grep -q "</html>" index.html
          grep -q 'application/ld+json' index.html
          if grep -q "{{" index.html; then
            echo "ERROR / ข้อผิดพลาด: index.html ยังมีตัวแปร {{...}} ที่ไม่ได้แทนค่า (unreplaced token remains)"
            exit 1
          fi

      # Stage only public files. Source, tests, workflow, and README stay out.
      - name: Stage minimal Pages artifact (เตรียมเฉพาะไฟล์เว็บสำหรับเผยแพร่)
        run: |
          rm -rf _site
          mkdir -p _site/images
          cp index.html robots.txt sitemap.xml _site/
          cp -R images/. _site/images/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      # PRs run every check above but never upload or deploy.
      - name: Upload validated Pages artifact (อัปโหลดไฟล์เว็บที่ตรวจแล้ว)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  # ---- Job 2: deploy the exact artifact above (main only) ----
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact (เผยแพร่ไฟล์เว็บที่ตรวจแล้ว)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
