# ============================================================
# GitHub Actions workflow: build -> validate -> deploy to Pages
# ห้ามแตะไฟล์นี้ / DO NOT EDIT this file
# ------------------------------------------------------------
# What it does (สิ่งที่ไฟล์นี้ทำ):
#   1. Builds index.html from template.html + variables.txt
#      (สร้าง index.html จาก template.html + variables.txt)
#   2. Validates the HTML so a bad edit cannot reach the live site
#      (ตรวจสอบ HTML เพื่อไม่ให้การแก้ไขที่ผิดพลาดไปถึงเว็บจริง)
#   3. Deploys to GitHub Pages only when validation passes
#      (อัปเดตเว็บจริงเฉพาะเมื่อตรวจสอบผ่านเท่านั้น)
# If this workflow fails (red X), the live site is NOT broken —
# it simply keeps the previous version.
# (ถ้าเห็นกากบาทแดง เว็บเดิมยังทำงานปกติ แค่ไม่อัปเดตเวอร์ชันใหม่)
# ============================================================

name: Build, validate, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- Job 1: build + validate (runs on every push and every PR) ----
  validate:
    name: Validate website (ตรวจสอบเว็บไซต์)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build index.html from the template. If variables.txt has a
      # mistake, build.py prints a Thai error message here and stops.
      - name: Build website from template (สร้างเว็บไซต์จาก template)
        run: python3 build.py

      # Structural HTML validation (catches unclosed/misplaced tags).
      # Rules are configured in .htmlvalidate.json
      - name: Validate HTML structure (ตรวจสอบโครงสร้าง HTML)
        run: npx --yes html-validate@11 index.html

      # Sentinel checks: make sure critical pieces still exist.
      - name: Check closing html tag (ตรวจสอบแท็กปิด html)
        run: grep -q "</html>" index.html

      - name: Check JSON-LD block (ตรวจสอบข้อมูล JSON-LD สำหรับ Google)
        run: grep -q 'application/ld+json' index.html

      - name: Check EDIT ME markers (ตรวจสอบเครื่องหมาย EDIT ME)
        run: grep -q "EDIT ME" template.html

      - name: Check copy-paste fences (ตรวจสอบเครื่องหมายคัดลอก)
        run: grep -q "คัดลอกตั้งแต่ตรงนี้" template.html

      - name: Check embedded CSS (ตรวจสอบ CSS ในไฟล์)
        run: |
          grep -q "<style>" template.html
          grep -q "</style>" template.html

  # ---- Job 2: deploy (only on main, only if validate passed) ----
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build website from template (สร้างเว็บไซต์จาก template)
        run: python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
